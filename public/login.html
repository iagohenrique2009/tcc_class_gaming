<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Class Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    
    <main>
        <div class="login-container">
            <h1>Class Gaming</h1>
            <div class="login-box">
                <form action="#" method="post">
                    <label for="login">Login:</label>
                    <input type="text" id="login" name="login" required>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                    <button type="submit">INICIAR</button>
                    <button type="submit" onclick="window.location.href='http://127.0.0.1:5500/public/cadastro.html'">CADASTRAR</button>
                </form>
                <p>Para ingressar você deve logar/cadastrar com seu e-mail de usuário FATEC.</p>
            </div>
        </div>
    </main>
    <script src="src/js/header-footer.js"></script>

</body>
</html>
