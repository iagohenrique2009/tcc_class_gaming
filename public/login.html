<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Gaming</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="login-container">
    <div class="main-content">
      <nav class="navigation">
        <a href="#" class="nav-item">Inicio</a>
        <a href="#" class="nav-item">Niveis</a>
        <a href="#" class="nav-item">Jogos</a>
        <a href="#" class="nav-item">Contato</a>
      </nav>
      <div class="content-wrapper">
        <div class="login-box">
          <img src="public\images\comp-fundo.png" alt="" class="background-image" />
          <div class="login-content">
            <h1 class="title">Class Gaming</h1>
            <form class="login-form">
              <div class="form-group">
                <label for="login-input" class="form-label">Login:</label>
                <input type="text" id="login-input" class="form-input" aria-label="Login" />
              </div>
              <div class="form-group">
                <label for="password-input" class="form-label">Password:</label>
                <input type="password" id="password-input" class="form-input" aria-label="Password" />
              </div>
              <button type="submit" class="submit-button">
                <span class="button-text">INICIAR</span>
              </button>
            </form>
            <p class="login-info">
              Para ingressar você deve logar/cadastar com seu e-mail de usuário FATEC
            </p>
          </div>
        </div>
        <footer>
          <p class="footer-text">© 2023 Class Gaming - All Rights Reserved</p>
        </footer>
      </div>
    </div>
  </section>
</body>
</html>
