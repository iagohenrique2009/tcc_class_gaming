<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Class Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/header-footer.css">

</head>
<body>
    <main>
        <div class="login-container">
            <h1>Class Gaming</h1>
            <div class="login-box">
                <form id="loginForm">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" name="email" required>
                    <label for="loginSenha">Senha:</label>
                    <input type="password" id="loginSenha" name="senha" required>
                    <button type="submit">INICIAR</button>
                </form>
                <p>Para ingressar você deve logar/cadastrar com seu e-mail de usuário FATEC.</p>
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>
    <script src="src/js/authorization.js"></script>
    <script src="src/js/header-footer.js"></script>
</body>
</html>
