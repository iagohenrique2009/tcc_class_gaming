<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Gaming - Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/quizz.css">
</head>
<body>
    <main>
        <div class="quiz-container">
            <div class="title">Quiz</div>
            <div id="question" class="question"></div>
            <label class="option">
                <input type="radio" name="option" value="1" />
                <span class="option1"></span>
            </label>
            <label class="option">
                <input type="radio" name="option" value="2" />
                <span class="option2"></span>
            </label>
            <label class="option">
                <input type="radio" name="option" value="3" />
                <span class="option3"></span>
            </label>
            <label class="option">
                <input type="radio" name="option" value="4" />
                <span class="option4"></span>
            </label>
            <label class="option">
                <input type="radio" name="option" value="5" />
                <span class="option5"></span>
            </label>
            <!-- Buttons -->
            <div class="controls">
                <button class="previous">Anterior</button>
                <button class="next">Próximo</button>
            </div>
        </div>
    
        <div class="result">
    
        </div>
    </main>

    <script src="src/js/header-footer.js"></script>
    <script src="src/js/quizz.js"></script>
</body>
</html>
