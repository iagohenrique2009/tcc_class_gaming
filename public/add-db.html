<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Conteúdo - Class Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/add-db.css">
    <link rel="stylesheet" href="css/header-footer.css">

</head>
<body>
    <header>
        <div class="logo">Class Gaming - Professor</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="levels.html">Níveis</a></li>
                <li><a href="game-list.html">Jogos</a></li>
                <li><a href="performance.html">Desempenho</a></li>
                <li><a href="professor.html">Professor</a></li>
                <li><a href="#" id="logoutButton">Logout</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h1>Adicionar Conteúdo</h1>
        
        <!-- Layout de navegação horizontal e formulários -->
        <div class="content-layout">
            <!-- Navegação entre Quiz, Jogo de Combinação e Palavras ao Vento -->
            <div class="tab-navigation-vertical">
                <button class="tab-button" onclick="showTab('quiz')">Adicionar Quiz</button>
                <button class="tab-button" onclick="showTab('combination')">Adicionar Jogo de Combinação</button>
                <button class="tab-button" onclick="showTab('windwords')">Adicionar Palavras ao Vento</button>
            </div>

            <!-- Formulário para adicionar Quiz -->
            <div id="quiz-form" class="tab-content active">
                <form id="quizForm">


                    <h2>Adicionar Novo Quiz</h2>
                    <label for="title">Título do Quiz:</label>
                    <input type="text" id="title" name="title" required>

                    <label for="description">Descrição do Quiz:</label>
                    <textarea id="description" name="description" required></textarea>

                    <label for="quizDropdown">Selecione um Quiz:</label>
                    <select id="quizDropdown" name="quizDropdown" required>
                        <option value="">Carregando quizzes...</option>
                    </select>
                    
                    <div id="questionsContainer">
                        <h2>Pergunta</h2>
                        <div class="question-block">
                            <label>Pergunta:</label>
                            <input type="text" class="question-text" required>

                            <label>Opções:</label>
                            <div class="options">
                                <div class="option-item">
                                    <label>A</label>
                                    <input type="text" class="option" placeholder="Opção A" required>
                                    <label class="correct-label">
                                        <input type="checkbox" class="correct-answer"> Correta
                                    </label>
                                </div>
                            </div>
                            <button type="button" class="add-option">Adicionar mais uma opção</button>
                        </div>
                    </div>

                    <button type="button" id="addQuizButton">Adicionar Quiz</button>
                </form>
            </div>

            <!-- Formulário para adicionar Jogo de Combinação -->
            <div id="combination-form" class="tab-content">
                <form id="combinationForm">
                    <h2>Adicionar Nova Combinação</h2>
                    <label for="comboName">Nome da Combinação:</label>
                    <input type="text" id="comboName" name="comboName" required>

                    <label for="comboImage">Imagem:</label>
                    <input type="file" id="comboImage" name="comboImage" accept="image/*" required>
                    <img id="previewImage" src="" alt="Pré-visualização da imagem" style="display: none; margin-top: 10px; width: 100%; max-width: 300px; border-radius: 8px;">

                    <label for="word">Palavra Correspondente:</label>
                    <input type="text" id="word" name="word" required>

                    <label>Dificuldade:</label>
                    <div class="difficulty">
                        <label><input type="checkbox" class="difficulty-level" value="1"> 1</label>
                        <label><input type="checkbox" class="difficulty-level" value="2"> 2</label>
                        <label><input type="checkbox" class="difficulty-level" value="3"> 3</label>
                        <label><input type="checkbox" class="difficulty-level" value="4"> 4</label>
                        <label><input type="checkbox" class="difficulty-level" value="5"> 5</label>
                        <label><input type="checkbox" class="difficulty-level" value="6"> 6</label>
                    </div>

                    <button type="button" id="addCombinationButton">Adicionar Combinação</button>
                </form>
            </div>

            <!-- Formulário para adicionar Palavras ao Vento -->
<!-- Formulário para adicionar Palavras ao Vento -->
<div id="windwords-form" class="tab-content">
    <form id="windwordsForm">
        <h2>Adicionar Palavras ao Vento</h2>
        <label for="windwordsTitle">Título:</label>
        <input type="text" id="windwordsTitle" name="windwordsTitle" required>

        <label for="windwordsText">Texto:</label>
        <textarea id="windwordsText" name="windwordsText" required></textarea>

        <label for="correctWords">Palavras Corretas (separadas por vírgula):</label>
        <input type="text" id="correctWords" name="correctWords" readonly>

        <label>Dificuldade:</label>
        <div class="difficulty">
            <label><input type="checkbox" class="difficulty-level" id="windwords-difficulty-1" value="1"> 1</label>
            <label><input type="checkbox" class="difficulty-level" id="windwords-difficulty-2" value="2"> 2</label>
            <label><input type="checkbox" class="difficulty-level" id="windwords-difficulty-3" value="3"> 3</label>
            <label><input type="checkbox" class="difficulty-level" id="windwords-difficulty-4" value="4"> 4</label>
            <label><input type="checkbox" class="difficulty-level" id="windwords-difficulty-5" value="5"> 5</label>
            <label><input type="checkbox" class="difficulty-level" id="windwords-difficulty-6" value="6"> 6</label>
        </div>

        <button type="button" id="addWindwordsButton">Adicionar Palavras ao Vento</button>
    </form>
</div>

    </div>
    <!-- Rodapé -->
    <footer>
        <p>© 2023 Class Gaming - All Rights Reserved</p>
    </footer>
    <script src="src/js/add-db.js"></script>
    <script src="src/js/header-footer.js"></script>

</body>
</html>
