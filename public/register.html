<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Class Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/header-footer.csss">

</head>
<body>
    <header>
        <div class="logo">Class Gaming</div>
        <nav>
            <ul>
                <li><a href="login.html">Início</a></li>
                <li><a href="about.html">Sobre</a></li>
                <li><a href="contact.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="login-container">
            <div class="login-box">
                <h2>Cadastro</h2>
                <form id="cadastroForm">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>

                    <label for="confirmarSenha">Confirmar Senha:</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" required>

                    <button type="submit">Cadastrar</button>
                </form>
                <p>Para ingressar você deve logar/cadastrar com seu e-mail de usuário FATEC.</p>
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2023 Class Gaming - All Rights Reserved</p>
    </footer>

    <script src="src/js/authorization.js"></script>
    <script src="src/js/header-footer.js"></script>

</body>
</html>
